# Local development / single-host Docker usage
#
# Usage:
#   docker compose -f compose.base.yml -f compose.dev.yml up -d --build
#   ./scripts/vps-migrate.sh dev
#
# With hybrid AI matcher:
#   COMPOSE_ML=1 BFF__MATCHER__BASE_URL=http://resume-matcher:8095 \
#     docker compose --profile ml -f compose.base.yml -f compose.dev.yml up -d --build

services:
  rustfs:
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"

  bff:
    environment:
      BFF__EMAIL__FRONTEND_BASE_URL: ${PUBLIC_WEB_URL:-http://localhost}
    ports:
      - "${BFF_HOST_PORT:-8000}:8000"

  resume-matcher:
    ports:
      - "${MATCHER_HOST_PORT:-8095}:8095"

  kraftisium-web:
    build:
      args:
        VITE_BFF_API_URL: ${VITE_BFF_API_URL:-__RELATIVE__}
        VITE_BFF_API_VERSION: ${VITE_BFF_API_VERSION:-v1}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        NGINX_CONF: nginx.dev.conf
    ports:
      - "${WEB_HOST_PORT:-80}:80"
